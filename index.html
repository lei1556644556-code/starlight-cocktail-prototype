<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>星光特调</title>
    <link rel="stylesheet" href="styles.css?v=20260513-responsive-assets">
  </head>
  <body>
    <main class="app">
      <section class="top-panel">
        <div>
          <p class="eyebrow">星光特调</p>
          <h1>调酒接待</h1>
        </div>
        <div class="stats">
          <div class="stat">
            <span>酣畅值</span>
            <strong id="score">0</strong>
          </div>
          <div class="stat">
            <span>特调币</span>
            <strong id="coin">0</strong>
          </div>
          <div class="stat">
            <span>体力</span>
            <strong id="energy">50</strong>
          </div>
          <div class="stat">
            <span>等级</span>
            <strong id="level">1</strong>
          </div>
        </div>
      </section>

      <section class="bar">
        <div class="host">
          <div class="portrait"></div>
          <div class="bubble" id="message">先把吧台的 3 个托盘放到桌面吧。</div>
        </div>
        <div class="tools">
          <button id="trashBtn" type="button">垃圾桶 <strong id="trashCount">2</strong></button>
          <button id="tongsBtn" type="button">夹子 <strong id="tongsCount">2</strong></button>
          <button id="newGameBtn" type="button">新开一局</button>
        </div>
      </section>

      <section class="play-area">
        <div class="board" id="board" aria-label="酒桌"></div>
        <div class="queue" id="queue" aria-label="吧台托盘"></div>
      </section>

      <section class="feedback">
        <div class="combo" id="combo">连击 x0</div>
        <div class="sound" id="soundCue">音效：待机</div>
      </section>

      <section class="legend" id="legend"></section>
    </main>

    <div class="effects" id="effects"></div>

    <div class="overlay hidden" id="overlay">
      <div class="modal">
        <h2 id="modalTitle">本局结束</h2>
        <div class="modal-stats" id="modalText"></div>
        <button id="modalBtn" type="button">再来一局</button>
      </div>
    </div>

    <script src="game.js?v=20260513-responsive-assets"></script>
  </body>
</html>
